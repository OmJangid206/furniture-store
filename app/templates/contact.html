{% extends "index.html" %}
{% load static %}

<!--header-->
{% block head %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}" />
{% endblock head %}

<!--body-->
{% block body %}
<div class="contact-container">
  <h2>Contact Us</h2> <hr>
  {% if message %}
  <div class="alert" role="alert">{{ message }} </div>
  {% endif %}
  <form action="/contact" method="POST">
    {% csrf_token %}

    <!-- Name -->
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" class="form-control" name="name" id="name" placeholder="Enter your name" required>
    </div>

    <!-- Phone Number -->
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="text" class="form-control" name="phone" id="phone" pattern="[0-9]{10}" placeholder="Enter your phone number" required>
    </div>

    <!-- Email address -->
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" required>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="textarea">Description</label>
      <textarea class="form-control" id="textarea" name="description" rows="3" placeholder="Enter your message"
        required></textarea>
    </div>
    <button type="submit" class="btn btn-info">Submit</button>
  </form>
</div>
</div>
{% endblock body %}

<!--Footer -->
{%block footer%}
{%endblock footer%}
